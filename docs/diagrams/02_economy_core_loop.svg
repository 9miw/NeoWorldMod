<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#121316; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  <defs>
    <linearGradient id="survGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="rpgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="econGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="sinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f472b6" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">⚖️ Core Gameplay Loop &amp; Economy System (ผังลูปการเล่นและเศรษฐกิจ)</text>
  <text x="500" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">การพึ่งพาอาศัยกันระหว่างสายสร้าง/ฟาร์ม (Survival) และสายลุยดันเจี้ยน (Combat)</text>

  <!-- Survival Loop Box -->
  <g transform="translate(60, 110)" filter="url(#shadow)">
    <rect width="400" height="210" rx="12" fill="#182721" stroke="#059669" stroke-width="1.5"/>
    <rect width="400" height="36" rx="12" fill="url(#survGrad)"/>
    <text x="20" y="24" fill="#ffffff" font-size="14" font-weight="bold">🌿 สายเอาชีวิตรอด &amp; งานช่าง (Survival / Life Skills)</text>
    
    <!-- Step 1 -->
    <rect x="20" y="55" width="105" height="65" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="72" y="80" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">⛏️ ฟาร์ม/ขุดแร่</text>
    <text x="72" y="100" text-anchor="middle" fill="#a7f3d0" font-size="10">ตัดไม้ / ทำอาหาร</text>

    <path d="M 125 87 L 145 87" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- Step 2 -->
    <rect x="150" y="55" width="105" height="65" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="202" y="80" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">🧪 แปรรูปของ</text>
    <text x="202" y="100" text-anchor="middle" fill="#a7f3d0" font-size="10">หลอมแร่ / ปรุงยา</text>

    <path d="M 255 87 L 275 87" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- Step 3 -->
    <rect x="280" y="55" width="100" height="65" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="330" y="80" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">🔨 คราฟต์เกียร์</text>
    <text x="330" y="100" text-anchor="middle" fill="#a7f3d0" font-size="10">ตีดาบ / ชุดเกราะ</text>

    <text x="200" y="155" text-anchor="middle" fill="#6ee7b7" font-size="11">ผลผลิต: โพชั่นบัฟ, เสบียงเรด, ชุดเกราะทนทานสูง</text>
    <text x="200" y="180" text-anchor="middle" fill="#93c5fd" font-size="11">➔ ส่งขายให้นักผจญภัยในตลาด</text>
  </g>

  <!-- RPG Loop Box -->
  <g transform="translate(60, 355)" filter="url(#shadow)">
    <rect width="400" height="210" rx="12" fill="#201a2b" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="400" height="36" rx="12" fill="url(#rpgGrad)"/>
    <text x="20" y="24" fill="#ffffff" font-size="14" font-weight="bold">⚔️ สายต่อสู้ &amp; ลุยดันเจี้ยน (Combat / PvE)</text>

    <!-- Step 1 -->
    <rect x="20" y="55" width="105" height="65" rx="8" fill="#3b0764" stroke="#c084fc" stroke-width="1"/>
    <text x="72" y="80" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">🏰 ลงดันเจี้ยน</text>
    <text x="72" y="100" text-anchor="middle" fill="#e9d5ff" font-size="10">ปราบ World Boss</text>

    <path d="M 125 87 L 145 87" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>

    <!-- Step 2 -->
    <rect x="150" y="55" width="105" height="65" rx="8" fill="#3b0764" stroke="#c084fc" stroke-width="1"/>
    <text x="202" y="80" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">💎 ดรอปแรร์</text>
    <text x="202" y="100" text-anchor="middle" fill="#e9d5ff" font-size="10">คอร์บอส / สกิลบุ๊ก</text>

    <path d="M 255 87 L 275 87" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>

    <!-- Step 3 -->
    <rect x="280" y="55" width="100" height="65" rx="8" fill="#3b0764" stroke="#c084fc" stroke-width="1"/>
    <text x="330" y="80" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">⚡ อัปเกรด</text>
    <text x="330" y="100" text-anchor="middle" fill="#e9d5ff" font-size="10">เลเวลพุ่ง / ปลดสกิล</text>

    <text x="200" y="155" text-anchor="middle" fill="#d8b4fe" font-size="11">ผลผลิต: วัตถุดิบบอสหายาก, ตำราเวท, หินตีบวก</text>
    <text x="200" y="180" text-anchor="middle" fill="#93c5fd" font-size="11">➔ ซื้อยาและอาหารจากสายฟาร์มเพื่อลุยต่อ</text>
  </g>

  <!-- Market & Economy Hub (Center Right) -->
  <g transform="translate(540, 110)" filter="url(#shadow)">
    <rect width="400" height="210" rx="12" fill="#292015" stroke="#d97706" stroke-width="1.5"/>
    <rect width="400" height="36" rx="12" fill="url(#econGrad)"/>
    <text x="20" y="24" fill="#ffffff" font-size="14" font-weight="bold">🏪 ตลาดกลาง &amp; การค้าขาย (Economy &amp; Trade)</text>

    <rect x="25" y="55" width="350" height="135" rx="8" fill="#1c160e" stroke="#fbbf24" stroke-width="1"/>
    <text x="200" y="85" text-anchor="middle" fill="#fef3c7" font-size="14" font-weight="bold">⚖️ Auction House &amp; Player Shops</text>
    <text x="200" y="112" text-anchor="middle" fill="#fde68a" font-size="12">• สายฟาร์มนำ อาหาร / น้ำยา / ชุดเกราะ มาวางขาย</text>
    <text x="200" y="137" text-anchor="middle" fill="#fde68a" font-size="12">• สายลุยนำ ชิ้นส่วนบอส / วัตถุดิบสร้างของเวท มาขาย</text>
    <text x="200" y="165" text-anchor="middle" fill="#67e8f9" font-size="11">หมุนเวียนเงินตรา (Coins) ระหว่างผู้เล่น</text>
  </g>

  <!-- Money Sink (Bottom Right) -->
  <g transform="translate(540, 355)" filter="url(#shadow)">
    <rect width="400" height="210" rx="12" fill="#2b141d" stroke="#db2777" stroke-width="1.5"/>
    <rect width="400" height="36" rx="12" fill="url(#sinkGrad)"/>
    <text x="20" y="24" fill="#ffffff" font-size="14" font-weight="bold">💸 ระบบดูดเงินออกจากระบบ (Currency Sinks)</text>

    <rect x="25" y="55" width="350" height="135" rx="8" fill="#1c0d13" stroke="#f472b6" stroke-width="1"/>
    <text x="200" y="85" text-anchor="middle" fill="#fce7f3" font-size="13" font-weight="bold">🔥 ป้องกันเงินเฟ้อ (Anti-Inflation Mechanism)</text>
    <text x="200" y="110" text-anchor="middle" fill="#fbcfe8" font-size="11">• ค่าธรรมเนียม &amp; ภาษีตั้งร้านในตลาด (5-10%)</text>
    <text x="200" y="130" text-anchor="middle" fill="#fbcfe8" font-size="11">• ค่าซ่อมอุปกรณ์ (Durability Repair Cost)</text>
    <text x="200" y="150" text-anchor="middle" fill="#fbcfe8" font-size="11">• ค่ารีเซ็ตสเตตัส / ค่าเดินทาง Fast Travel / ค่าต่ออายุโพรเทกต์</text>
    <text x="200" y="172" text-anchor="middle" fill="#fda4af" font-size="11">รักษาสมดุลของระบบเศรษฐกิจระยะยาว</text>
  </g>

  <!-- Flow Arrows connecting groups -->
  <!-- Survival to Market -->
  <path d="M 460 190 L 530 190" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrowGold)"/>
  <text x="495" y="180" text-anchor="middle" fill="#fbbf24" font-size="10">นำของไปขาย</text>

  <!-- RPG to Market -->
  <path d="M 460 435 Q 495 435 505 320 Q 515 230 530 230" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrowGold)"/>
  <text x="495" y="325" text-anchor="middle" fill="#fbbf24" font-size="10">ขายของบอส</text>

  <!-- Market to Sink -->
  <path d="M 740 320 L 740 350" stroke="#f472b6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowRed)"/>
  <text x="785" y="340" fill="#f472b6" font-size="10">หักภาษี</text>
</svg>
