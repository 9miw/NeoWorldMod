<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  <defs>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadowBox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="bidirArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="dbArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">⚙️ Technical Mod Architecture (สถาปัตยกรรมระบบ Mod NeoForge 1.21.1)</text>
  <text x="500" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">โครงสร้างการสื่อสารระหว่าง Client, Network Packets, Epic Fight Native Attributes และ Data Attachment</text>

  <!-- Client Side -->
  <g transform="translate(60, 110)" filter="url(#shadowBox)">
    <rect width="250" height="420" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>
    <rect width="250" height="45" rx="12" fill="url(#clientGrad)"/>
    <text x="125" y="28" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">🖥️ Client Side (ผู้เล่น)</text>
    
    <!-- Client Modules -->
    <rect x="15" y="65" width="220" height="95" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="90" fill="#38bdf8" font-size="13" font-weight="bold">📊 Epic Fight Native HUD</text>
    <text x="25" y="112" fill="#cbd5e1" font-size="11">• Stamina Bar &amp; Dodge Indicator</text>
    <text x="25" y="130" fill="#cbd5e1" font-size="11">• Poise / Stun Stagger Gauge</text>
    <text x="25" y="148" fill="#cbd5e1" font-size="11">• Target Health &amp; Lock-on</text>

    <rect x="15" y="175" width="220" height="110" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="200" fill="#38bdf8" font-size="13" font-weight="bold">🎨 Custom GUI &amp; Menus</text>
    <text x="25" y="222" fill="#cbd5e1" font-size="11">• Level &amp; EXP Progress Screen</text>
    <text x="25" y="240" fill="#cbd5e1" font-size="11">• Epic Fight Skill Book Editor</text>
    <text x="25" y="258" fill="#cbd5e1" font-size="11">• Weapon Requirement Tooltip</text>
    <text x="25" y="276" fill="#cbd5e1" font-size="11">• Quest Log &amp; Reward Claim</text>

    <rect x="15" y="300" width="220" height="100" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="325" fill="#38bdf8" font-size="13" font-weight="bold">🎮 Combat &amp; Controls</text>
    <text x="25" y="347" fill="#cbd5e1" font-size="11">• Epic Fight Combat Mode (R Key)</text>
    <text x="25" y="365" fill="#cbd5e1" font-size="11">• Dodge Roll &amp; Weapon Arts</text>
    <text x="25" y="383" fill="#cbd5e1" font-size="11">• Level-lock Attack Blocker</text>
  </g>

  <!-- Network Layer (Center) -->
  <g transform="translate(370, 160)" filter="url(#shadowBox)">
    <rect width="260" height="320" rx="12" fill="#132a2a" stroke="#0d9488" stroke-width="2"/>
    <rect width="260" height="40" rx="12" fill="url(#netGrad)"/>
    <text x="130" y="25" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">📡 Network Payloads</text>

    <rect x="15" y="55" width="230" height="75" rx="8" fill="#042f2e" stroke="#2dd4bf" stroke-width="1"/>
    <text x="25" y="78" fill="#5eead4" font-size="12" font-weight="bold">C2S (Client to Server)</text>
    <text x="25" y="98" fill="#ccfbf1" font-size="11">• RequestLevelUpClaim()</text>
    <text x="25" y="116" fill="#ccfbf1" font-size="11">• EquipEpicSkillPayload(slot, id)</text>

    <rect x="15" y="145" width="230" height="150" rx="8" fill="#042f2e" stroke="#2dd4bf" stroke-width="1"/>
    <text x="25" y="168" fill="#5eead4" font-size="12" font-weight="bold">S2C (Server to Client)</text>
    <text x="25" y="188" fill="#ccfbf1" font-size="11">• SyncPlayerLevelPayload(level, exp)</text>
    <text x="25" y="206" fill="#ccfbf1" font-size="11">• LevelUpCelebrationPayload(level)</text>
    <text x="25" y="224" fill="#ccfbf1" font-size="11">• SyncUnlockedGearsPayload(list)</text>
    <text x="25" y="242" fill="#ccfbf1" font-size="11">• WeaponReqDeniedPayload(reason)</text>
    <text x="25" y="260" fill="#ccfbf1" font-size="11">• QuestProgressPayload(questData)</text>
  </g>

  <!-- Server Side -->
  <g transform="translate(690, 110)" filter="url(#shadowBox)">
    <rect width="250" height="420" rx="12" fill="#1e1b4b" stroke="#4f46e5" stroke-width="2"/>
    <rect width="250" height="45" rx="12" fill="url(#serverGrad)"/>
    <text x="125" y="28" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">⚙️ Server Side (เซิร์ฟเวอร์)</text>

    <!-- Server Modules -->
    <rect x="15" y="65" width="220" height="95" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
    <text x="25" y="90" fill="#818cf8" font-size="13" font-weight="bold">📈 Epic Fight Attribute Scaling</text>
    <text x="25" y="112" fill="#cbd5e1" font-size="11">• Auto +0.5 Max Stamina / Lv</text>
    <text x="25" y="130" fill="#cbd5e1" font-size="11">• Auto +0.2 Stun Armor / Lv</text>
    <text x="25" y="148" fill="#cbd5e1" font-size="11">• Auto +1 Max HP / 2 Lvs</text>

    <rect x="15" y="175" width="220" height="110" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
    <text x="25" y="200" fill="#818cf8" font-size="13" font-weight="bold">💾 Data Attachment</text>
    <text x="25" y="222" fill="#cbd5e1" font-size="11">• Player Level &amp; Current EXP</text>
    <text x="25" y="240" fill="#cbd5e1" font-size="11">• Unlocked Epic Fight Skill Slots</text>
    <text x="25" y="258" fill="#cbd5e1" font-size="11">• Discovered Weapon Blueprints</text>
    <text x="25" y="276" fill="#cbd5e1" font-size="11">• Completed Quests &amp; Milestones</text>

    <rect x="15" y="300" width="220" height="100" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
    <text x="25" y="325" fill="#818cf8" font-size="13" font-weight="bold">⚔️ Level Gating &amp; Combat</text>
    <text x="25" y="347" fill="#cbd5e1" font-size="11">• Check Weapon Level Req on Attack</text>
    <text x="25" y="365" fill="#cbd5e1" font-size="11">• Boss Encounter Level Restrictions</text>
    <text x="25" y="383" fill="#cbd5e1" font-size="11">• Safe Zone Combat Protection</text>
  </g>

  <!-- Connectors -->
  <path d="M 310 240 L 360 240" stroke="#38bdf8" stroke-width="2" marker-end="url(#bidirArrow)"/>
  <path d="M 360 300 L 315 300" stroke="#38bdf8" stroke-width="2" marker-end="url(#bidirArrow)"/>

  <path d="M 630 240 L 680 240" stroke="#818cf8" stroke-width="2" marker-end="url(#dbArrow)"/>
  <path d="M 680 300 L 635 300" stroke="#818cf8" stroke-width="2" marker-end="url(#dbArrow)"/>

  <!-- Storage Footer -->
  <g transform="translate(370, 520)" filter="url(#shadowBox)">
    <rect width="260" height="85" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="130" y="28" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">💾 Data Persistence (การบันทึกข้อมูล)</text>
    <text x="130" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">• Saved to Player NBT on Server Save</text>
    <text x="130" y="68" text-anchor="middle" fill="#94a3b8" font-size="11">• Apply Attribute Modifiers upon Login</text>
  </g>

  <path d="M 750 530 L 750 560 L 640 560" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#dbArrow)"/>
</svg>
