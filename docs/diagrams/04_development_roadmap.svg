<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#0b0f19; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="p5Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Header -->
  <text x="500" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">🚀 Server Development Roadmap (แผนผังขั้นตอนการพัฒนา)</text>
  <text x="500" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">ลำดับการสร้างและเปิดเซิร์ฟเวอร์ MMORPG x Survival ตั้งแต่เริ่มต้นจนถึงวันเปิดบริการ</text>

  <!-- Timeline Center Line -->
  <line x1="500" y1="100" x2="500" y2="620" stroke="#334155" stroke-width="4" stroke-dasharray="6 6"/>

  <!-- Phase 1: Left -->
  <g transform="translate(60, 100)" filter="url(#cardShadow)">
    <rect width="390" height="95" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="390" height="28" rx="10" fill="url(#p1Grad)"/>
    <text x="15" y="19" fill="#ffffff" font-size="13" font-weight="bold">Phase 1: Core System (สัปดาห์ 1-2)</text>
    <text x="15" y="48" fill="#e2e8f0" font-size="11">✓ Player Stats Attachment (Level, EXP, Mana, STR, AGI, INT)</text>
    <text x="15" y="66" fill="#e2e8f0" font-size="11">✓ Basic Custom Weapons with Item Modifiers</text>
    <text x="15" y="84" fill="#93c5fd" font-size="10">✓ Data Persistence (NBT Save &amp; Packet Sync)</text>
  </g>
  <circle cx="500" cy="148" r="10" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>

  <!-- Phase 2: Right -->
  <g transform="translate(550, 195)" filter="url(#cardShadow)">
    <rect width="390" height="95" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="390" height="28" rx="10" fill="url(#p2Grad)"/>
    <text x="15" y="19" fill="#ffffff" font-size="13" font-weight="bold">Phase 2: Combat &amp; Skills (สัปดาห์ 3-4)</text>
    <text x="15" y="48" fill="#e2e8f0" font-size="11">✓ Skill Tree &amp; Class Selection (Warrior, Mage, Ranger)</text>
    <text x="15" y="66" fill="#e2e8f0" font-size="11">✓ Custom Damage Engine (Crit, Defense, Elemental Piercing)</text>
    <text x="15" y="84" fill="#c4b5fd" font-size="10">✓ Custom HUD Overlay (Mana Bar, Damage Numbers)</text>
  </g>
  <circle cx="500" cy="242" r="10" fill="#8b5cf6" stroke="#ffffff" stroke-width="2"/>

  <!-- Phase 3: Left -->
  <g transform="translate(60, 290)" filter="url(#cardShadow)">
    <rect width="390" height="95" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="390" height="28" rx="10" fill="url(#p3Grad)"/>
    <text x="15" y="19" fill="#ffffff" font-size="13" font-weight="bold">Phase 3: World &amp; Survival (สัปดาห์ 5-6)</text>
    <text x="15" y="48" fill="#e2e8f0" font-size="11">✓ Safe Zone Town / Capital City Protection</text>
    <text x="15" y="66" fill="#e2e8f0" font-size="11">✓ Zone-based Mob Scaling &amp; Elite Monster Spawners</text>
    <text x="15" y="84" fill="#6ee7b7" font-size="10">✓ Land Claiming &amp; Survival Base Building Rules</text>
  </g>
  <circle cx="500" cy="338" r="10" fill="#10b981" stroke="#ffffff" stroke-width="2"/>

  <!-- Phase 4: Right -->
  <g transform="translate(550, 385)" filter="url(#cardShadow)">
    <rect width="390" height="95" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="390" height="28" rx="10" fill="url(#p4Grad)"/>
    <text x="15" y="19" fill="#ffffff" font-size="13" font-weight="bold">Phase 4: Economy &amp; Quests (สัปดาห์ 7-8)</text>
    <text x="15" y="48" fill="#e2e8f0" font-size="11">✓ NPC Dialogue System &amp; Main / Daily Questlines</text>
    <text x="15" y="66" fill="#e2e8f0" font-size="11">✓ Player Auction House &amp; Market Anti-Inflation Sinks</text>
    <text x="15" y="84" fill="#fde68a" font-size="10">✓ Balanced Death Penalty (Soulbound vs Resource Drops)</text>
  </g>
  <circle cx="500" cy="432" r="10" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>

  <!-- Phase 5: Center Big Card -->
  <g transform="translate(250, 500)" filter="url(#cardShadow)">
    <rect width="500" height="110" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <rect width="500" height="32" rx="12" fill="url(#p5Grad)"/>
    <text x="250" y="22" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Phase 5: Testing &amp; Grand Launch (สัปดาห์ 9-10)</text>
    <text x="250" y="55" text-anchor="middle" fill="#fecdd3" font-size="12">🛡️ Closed Alpha: ทดสอบระบบภายใน บอส สเตตัส และบาลานซ์</text>
    <text x="250" y="75" text-anchor="middle" fill="#fecdd3" font-size="12">🌐 Open Beta: Stress Test ผู้เล่นพร้อมกัน และเสถียรภาพเซิร์ฟเวอร์</text>
    <text x="250" y="96" text-anchor="middle" fill="#fda4af" font-size="12" font-weight="bold">🎉 Official Server Launch &amp; Season 1 Opening</text>
  </g>
  <circle cx="500" cy="555" r="12" fill="#f43f5e" stroke="#ffffff" stroke-width="2.5"/>
</svg>
