# ตัวอย่างค่าเริ่มต้นของระบบ EXP; แก้ไฟล์จริงใน <world>/serverconfig/
[monsterExperience]
# เปิด/ปิดการดรอปใหม่ ไอเทม EXP ที่มีอยู่แล้วไม่เปลี่ยน
enabled = true
# ดาเมจผู้เล่นรวมขั้นต่ำเป็น % ของเลือดสูงสุด (0–100)
minimumPlayerDamagePercent = 50.0
# เวลาหลังดาเมจผู้เล่นครั้งล่าสุด หน่วยวินาทีในเกม (1–3600)
combatWindowSeconds = 15
# 0 = ปิด EXP จากสปอว์เนอร์, 0.25 = 25%, 1 = เต็ม (0–100)
spawnerExpMultiplier = 0.25
# Dimension ID ของโลกเก็บเลเวลสำหรับแชร์ EXP ปาร์ตี้; เว้นว่างเพื่อปิด
partySharedExpDimension = ""
# entity_id=ต่ำสุด,สูงสุด; ใช้ 0,0 หรือเอารายการออกเพื่อปิดชนิดนั้น
# เพิ่มรหัสมอนสเตอร์จากม็อดได้ รหัสซ้ำใช้ค่าจากรายการท้ายสุด
# ขนาด Slime/Magma Cube: @small = 1, @medium = 2, @large = 4 ขึ้นไป
