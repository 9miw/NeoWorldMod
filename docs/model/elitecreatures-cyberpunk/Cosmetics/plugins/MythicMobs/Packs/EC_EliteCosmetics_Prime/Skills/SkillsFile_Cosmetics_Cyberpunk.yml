ECCosmetics_Prime-Cyberpunk-CosmeticsBind: #Only for Armors
  Cooldown: 2
  Conditions:
  #- hasaura CosmeticsBind_WarnStacking orElsecast ECCosmetics_Prime-Cyberpunk-CosmeticsBind-WarnStacking
  - stringequals{val1="<caster.item.offhand.nbt.MYTHIC_TYPE>";val2="UNDEFINED"} orElsecast ECCosmetics_Prime-Cyberpunk-CosmeticsBind-AlreadyMythicItem
  Skills:
  - setItemNBT{slot=OFFHAND;key=MYTHIC_TYPE;value=ECCosmetics_Prime-Cyberpunk-Main} @self
  
  - message{m="&8&n_________________________________________"}
  - message{m="&3"}
  - message{m="&dElite-Cosmetics Legacy &eBound to the offhand-item"} @self
  - setNoDamageTicks{ticks=2} @self
  - sound{s=minecraft:ui.toast.challenge_complete;p=2;v=1;audience=CASTER} @self
  - effect:firework{t=BALL_LARGE;d=0;f=true;tr=true} @selflocation{y=1}
  ### ECCosmetics LIST
  - setItemNBT{slot=OFFHAND;key=ECCosmetics;value=Enable} @self

  #- command{c="item modify entity <caster.name> weapon.offhand minecraft<&co>setcount_a1"} @self

  - setItemNBT{slot=OFFHAND;key=ECCosmetics-Type;value=Core-Cosmetics} @self ?holding{m=ECCosmetics_Prime-Cyberpunk-Cosmetics-Core}

  - message{m="&ewith &bCore-Cosmetics"} ?stringequals{val1="<caster.item.offhand.nbt.ECCosmetics-Type>";val2="Core-Cosmetics"}
  - message{m="&8&n_________________________________________"}
  - consumehelditem

