  Display: '&eMain'
  Skills:
  - skill{s=ECCosmetics_Prime-Cyberpunk-Equip-OtherItem} @self ~onEquip
  - skill{s=ECCosmetics_Prime-Cyberpunk-Equip-OtherItem} @self ~onSpawn
  - skill{s=ECCosmetics_Prime-Cyberpunk-Equip-OtherItem} @self ~onJoin
  - skill{s=ECCosmetics_Prime-Cyberpunk-Equip-OtherItem} @self ~onRightclick ?!hasaura{aura=ECCosmetics-Equipping}
  - skill{s=ECCosmetics_Prime-Cyberpunk-Debug} @self ~onHold
  - skill{s=ECCosmetics_Prime-Cyberpunk-Equip-OtherItem} @self ~onTimer:10 ?!hastag{t=ECCosmetics-EquippingTag} ?!hasaura{aura=ECCosmetics-OtherItem} ?!stringequals{val1="<caster.item.hand.nbt.ECCosmetics-OtherItem>";val2="Enable"}
  - skill{s=ECCosmetics_Prime-Cyberpunk-Unequip} @self ~onDeath