ECCosmetics_Prime-Cyberpunk-Main:
  Id: DIAMOND_CHESTPLATE
  Display: '&eMain'
  Skills:
  - skill{s=ECCosmetics_Prime-Cyberpunk-Equip} @self ~onEquip
  - skill{s=ECCosmetics_Prime-Cyberpunk-Equip} @self ~onSpawn
  - skill{s=ECCosmetics_Prime-Cyberpunk-Equip} @self ~onJoin
  - skill{s=ECCosmetics_Prime-Cyberpunk-Debug} @self ~onHold
  - skill{s=ECCosmetics_Prime-Cyberpunk-Equip} @self ~onTimer:10 ?!hastag{t=ECCosmetics-EquippingTag} ?!hasaura{aura=ECCosmetics-Equipping}
  - skill{s=ECCosmetics_Prime-Cyberpunk-Unequip} @self ~onDeath
  - skill{s=ECCosmetics_Prime-Cyberpunk-Unequip} @self ~onUnEquip

