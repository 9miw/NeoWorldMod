KFX_Prime-Cyberpunk-SkinInherit:
  Skills:
  - setvariable{var=caster.dead_username;value="<target.uuid>";type=STRING} @Owner
  - modelplayerskin{uuid=<caster.var.dead_username>;sync=true} @self ?!stringequals{val1="<caster.var.dead_username>";val2="UNDEFINED"}
  
  
