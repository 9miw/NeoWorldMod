############### Chest and Key

cyberpunk_animated-key:
  displayname: Display
  material: DIAMOND_SWORD
  Pack:
    generate_model: false
    #custom_model_data: Define your custom Model Data 
    model: elitecreatures:cyberpunk_animated/key

cyberpunk_chest:
  displayname: <white>Chest
  material: PAPER
  Pack:
    generate_model: false
    model: elitecreatures:cyberpunk_animated/chest
    #custom_model_data: Define
  Mechanics:
    furniture:
      type: ITEM_FRAME # Valid types are ITEM_FRAME, DISPLAY_ENTITY & GLOWING_ITEM_FRAME
      block_sounds:
        place_sound: block.stone.place
        break_sound: block.stone.break
        hit_sound: block.stone.place # Custom sound as defined in Oraxen/sound.yml
        step_sound: block.stone.place # Requires a sound-file in the Oraxen/pack-folder aswell
        fall_sound: block.stone.place
      barrier: true
      drop:
        silktouch: false
        loots:
        - oraxen_item: cyberpunk_chest
          probability: 1.0