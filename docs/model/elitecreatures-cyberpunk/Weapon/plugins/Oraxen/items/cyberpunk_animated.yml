############# Special Event Items 

cyberpunk_animated-bow:
  displayname: "<white>DISPLAY"
  material: BOW
  Pack:
    generate_model: false
    #custom_model_data: Define you ModelData
    model: elitecreatures:cyberpunk_animated/bow #<- Make sure
    pulling_models:
    - elitecreatures:cyberpunk_animated/bow_0
    - elitecreatures:cyberpunk_animated/bow_1
    - elitecreatures:cyberpunk_animated/bow_2

cyberpunk_animated-shield:
  displayname: "<white>Shield"
  material: SHIELD
  Pack:
    generate_model: false
    #custom_model_data: Define you ModelData
    model: elitecreatures:cyberpunk_animated/shield
    blocking_model: elitecreatures:cyberpunk_animated/shield_blocking #<- Make sure

cyberpunk_animated-fishing_rod:
  displayname: "<white>Shield"
  material: FISHING_ROD
  Pack:
    generate_model: false
    #custom_model_data: Define you ModelData
    model: elitecreatures:cyberpunk_animated/fishing_rod
    cast_model: elitecreatures:cyberpunk_animated/fishing_rod_cast #<- Make sure

cyberpunk_animated-crossbow:
  displayname: <white>DISPLAY
  material: CROSSBOW
  Pack:
    generate_model: false
    model: elitecreatures:cyberpunk_animated/crossbow
    pulling_models:
    - elitecreatures:cyberpunk_animated/crossbow_0
    - elitecreatures:cyberpunk_animated/crossbow_1
    - elitecreatures:cyberpunk_animated/crossbow_2
    charged_model: elitecreatures:cyberpunk_animated/crossbow_charged
    firework_model: elitecreatures:cyberpunk_animated/crossbow_charged
    custom_model_data: 1000

